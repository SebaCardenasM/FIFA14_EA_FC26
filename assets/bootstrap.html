<!DOCTYPE HTML>
<html>
    <head></head>
    <body>
    <script type="text/javascript">
            if (typeof(nativeBridge) === 'undefined') {
                console.error('nativeBridge has not been defined - cannot continue or warn application');
            } else if (navigator.onLine) {
                window["_originBootstrapCallbackApplicationUrl"]=function (response) {
                    nativeBridge.log("Loading Origin application loader from [" + response.data.applicationLoaderUrl + "]");
                    window.location = response.data.applicationLoaderUrl;
                }
                
                nativeBridge.getApplicationLoaderUrl("_originBootstrapCallbackApplicationUrl");
            } else {
                nativeBridge.notify(null,'INITIALISATION_FAILURE','{}');
            }
        </script>
    </body>
</html>
